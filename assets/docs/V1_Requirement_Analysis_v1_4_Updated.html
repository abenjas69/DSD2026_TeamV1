<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>V1 - Requirement Analysis v1.4</title>
  <style>
    :root {
      --bg: #0b0f14;
      --bg-soft: #121821;
      --card: #161d27;
      --text: #f3f5f7;
      --muted: #a8b2bf;
      --line: #283241;
      --accent: #45d483;
      --accent-soft: rgba(69, 212, 131, 0.12);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Inter, system-ui, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
    }

    main {
      width: min(1040px, calc(100% - 2rem));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    .doc-header {
      padding: 28px;
      border: 1px solid rgba(69, 212, 131, 0.28);
      border-radius: 18px;
      background: linear-gradient(180deg, rgba(69, 212, 131, 0.08), rgba(69, 212, 131, 0.03));
      margin-bottom: 28px;
    }

    .eyebrow {
      margin: 0 0 8px;
      color: var(--accent);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 10px;
      font-size: clamp(2rem, 4vw, 3.4rem);
      line-height: 1.1;
    }

    h2,
    h3,
    h4 {
      color: var(--text);
      line-height: 1.25;
    }

    h2 {
      margin-top: 38px;
      padding-top: 22px;
      border-top: 1px solid var(--line);
      font-size: 1.7rem;
    }

    h3 {
      margin-top: 28px;
      font-size: 1.25rem;
    }

    p,
    li {
      color: var(--muted);
    }

    a {
      color: var(--text);
    }

    code {
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.08);
      color: var(--text);
      font-size: 0.92em;
      padding: 2px 6px;
    }

    pre {
      overflow-x: auto;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #070a0f;
      padding: 18px;
    }

    pre code {
      background: transparent;
      padding: 0;
    }

    blockquote {
      margin: 20px 0;
      padding: 16px 18px;
      border-left: 4px solid var(--accent);
      border-radius: 12px;
      background: var(--accent-soft);
    }

    blockquote p {
      margin: 0;
      color: var(--text);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      margin: 18px 0 26px;
      overflow: hidden;
      border: 1px solid var(--line);
      border-radius: 14px;
      display: block;
      overflow-x: auto;
      background: var(--card);
    }

    th,
    td {
      min-width: 150px;
      padding: 12px 14px;
      border-bottom: 1px solid var(--line);
      border-right: 1px solid var(--line);
      vertical-align: top;
      color: var(--muted);
    }

    th {
      color: var(--text);
      background: rgba(255, 255, 255, 0.04);
      text-align: left;
    }

    hr {
      border: 0;
      border-top: 1px solid var(--line);
      margin: 30px 0;
    }

    .doc-actions {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 18px;
    }

    .doc-button {
      display: inline-block;
      padding: 10px 16px;
      border-radius: 12px;
      border: 1px solid rgba(69, 212, 131, 0.28);
      background: var(--accent-soft);
      color: var(--text);
      font-weight: 700;
      text-decoration: none;
    }

    .doc-button.secondary {
      background: transparent;
      border-color: var(--line);
      color: var(--muted);
    }

    .loading {
      color: var(--muted);
      padding: 22px;
      border: 1px solid var(--line);
      border-radius: 16px;
      background: var(--card);
    }
  </style>
</head>
<body>
  <main>
    <header class="doc-header">
      <p class="eyebrow">Team V1 Document</p>
      <h1>Requirement Analysis v1.4</h1>
      <p>
        Updated Requirement Analysis for Team V1, aligned with the current V2 Generation 1 API,
        the two-angle input clarification, and the future IMU-based extension plan.
      </p>
      <div class="doc-actions">
        <a class="doc-button secondary" href="../../documents.html">Back to documents</a>
        <a class="doc-button" href="V1_Requirement_Analysis_v1_4_Updated.pdf" download>Download PDF</a>
        <a class="doc-button secondary" href="V1_Requirement_Analysis_v1_4_Updated.md">Markdown</a>
      </div>
    </header>

    <article id="documentContent" class="loading">Loading Requirement Analysis v1.4...</article>
  </main>

  <script>
    const markdownFile = "V1_Requirement_Analysis_v1_4_Updated.md";
    const content = document.getElementById("documentContent");

    function escapeHtml(value) {
      return value
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function inlineMarkdown(value) {
      return escapeHtml(value)
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
        .replace(/\[([^\]]+)\]\(([^)]+)\)/g, "<a " + "href=\"$2\">$1</a>");
    }

    function renderTable(lines, startIndex) {
      const rows = [];
      let index = startIndex;

      while (index < lines.length && /^\|.*\|$/.test(lines[index].trim())) {
        rows.push(lines[index].trim());
        index += 1;
      }

      const htmlRows = rows
        .filter((row, rowIndex) => rowIndex !== 1 || !/^\|[\s:\-|]+\|$/.test(row))
        .map((row, rowIndex) => {
          const cells = row.slice(1, -1).split("|").map(cell => inlineMarkdown(cell.trim()));
          const tag = rowIndex === 0 ? "th" : "td";
          return `<tr>${cells.map(cell => `<${tag}>${cell}</${tag}>`).join("")}</tr>`;
        })
        .join("");

      return {
        html: `<table><tbody>${htmlRows}</tbody></table>`,
        nextIndex: index
      };
    }

    function renderMarkdown(markdown) {
      const lines = markdown.replace(/\r\n/g, "\n").split("\n");
      const output = [];
      let paragraph = [];
      let list = [];
      let inCode = false;
      let codeLines = [];

      function flushParagraph() {
        if (paragraph.length) {
          output.push(`<p>${inlineMarkdown(paragraph.join(" "))}</p>`);
          paragraph = [];
        }
      }

      function flushList() {
        if (list.length) {
          output.push(`<ul>${list.map(item => `<li>${inlineMarkdown(item)}</li>`).join("")}</ul>`);
          list = [];
        }
      }

      for (let index = 0; index < lines.length; index += 1) {
        const rawLine = lines[index];
        const line = rawLine.trim();

        if (line.startsWith("```")) {
          if (inCode) {
            output.push(`<pre><code>${escapeHtml(codeLines.join("\n"))}</code></pre>`);
            codeLines = [];
            inCode = false;
          } else {
            flushParagraph();
            flushList();
            inCode = true;
          }
          continue;
        }

        if (inCode) {
          codeLines.push(rawLine);
          continue;
        }

        if (!line) {
          flushParagraph();
          flushList();
          continue;
        }

        if (/^\|.*\|$/.test(line) && index + 1 < lines.length && /^\|[\s:\-|]+\|$/.test(lines[index + 1].trim())) {
          flushParagraph();
          flushList();
          const table = renderTable(lines, index);
          output.push(table.html);
          index = table.nextIndex - 1;
          continue;
        }

        const heading = line.match(/^(#{1,4})\s+(.*)$/);
        if (heading) {
          flushParagraph();
          flushList();
          const level = heading[1].length;
          output.push(`<h${level}>${inlineMarkdown(heading[2])}</h${level}>`);
          continue;
        }

        if (line === "---") {
          flushParagraph();
          flushList();
          output.push("<hr />");
          continue;
        }

        if (line.startsWith("> ")) {
          flushParagraph();
          flushList();
          output.push(`<blockquote><p>${inlineMarkdown(line.slice(2))}</p></blockquote>`);
          continue;
        }

        if (line.startsWith("- ")) {
          flushParagraph();
          list.push(line.slice(2));
          continue;
        }

        paragraph.push(line);
      }

      flushParagraph();
      flushList();
      return output.join("\n");
    }

    fetch(markdownFile)
      .then(response => {
        if (!response.ok) {
          throw new Error("Unable to load Markdown file.");
        }
        return response.text();
      })
      .then(markdown => {
        content.classList.remove("loading");
        content.innerHTML = renderMarkdown(markdown);
      })
      .catch(() => {
        content.innerHTML = 'Unable to load the Markdown article. Please use the <a href="V1_Requirement_Analysis_v1_4_Updated.pdf">PDF version</a>.';
      });
  </script>
</body>
</html>
